services:
  sub-forge:
    image: ghcr.io/enximi/sub-forge:v0.6.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8080"
    environment:
      # 部署时改为用户与转换器均可访问的实际 API 地址。
      SUB_FORGE_PUBLIC_BASE_URL: https://sub.example.com
      SUB_FORGE_DATABASE_PATH: /app/data/sub-forge.sqlite3
      SUB_FORGE_LISTEN_ADDR: 0.0.0.0:8080
      # 留空公开管理；填写后生成、载入和更新接口均验证 token（32 至 256 个可打印 ASCII 字符，无空白）。
      SUB_FORGE_ACCESS_TOKEN: ""
      SUB_FORGE_TIMEOUT_SECS: 60
      SUB_FORGE_RULES_TIMEOUT_SECS: 30
      MAX_GENERATED_CONFIG_BYTES: 20971520
      MAX_SUBSCRIPTION_BYTES: 10485760
      MAX_ACL4SSR_CONFIG_BYTES: 2097152
      SCRIPT_TIMEOUT_MS: 2000
      SCRIPT_MEMORY_BYTES: 134217728
      SCRIPT_MAX_BYTES: 1048576
      SCRIPT_CONCURRENCY: 4
      REQUESTS_PER_MINUTE: 60
      CONVERSION_CONCURRENCY: 4
      FETCH_CONCURRENCY: 16
      TRUSTED_PROXY_CIDRS: ""
      SUB_FORGE_ALLOWED_ORIGINS: ""
    volumes:
      - sub-forge-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true

volumes:
  sub-forge-data:
