[workspace]
members = ["crates/sub-forge"]
default-members = ["crates/sub-forge"]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/enximi/sub-forge"

[workspace.dependencies]
rusqlite = { version = "0.38", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
ipnet = "2"
axum = "0.8"
config = { version = "0.15.27", default-features = false }
dotenvy = "0.15"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
rquickjs = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tower-http = { version = "0.6", default-features = false, features = ["cors"] }
