# 可选订阅管理器，不是 sub-forge 的运行依赖；用户提交其可公网访问的订阅链接。
services:
  sub-store:
    image: xream/sub-store:2.42.3-http-meta
    restart: unless-stopped
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      SUB_STORE_BACKEND_API_HOST: 0.0.0.0
      SUB_STORE_BACKEND_API_PORT: 8002
      SUB_STORE_FRONTEND_BACKEND_PATH: /${SUB_STORE_TOKEN:?SUB_STORE_TOKEN is required for optional Sub-Store}
      SUB_STORE_FRONTEND_PATH: /opt/app/frontend
      SUB_STORE_FRONTEND_PORT: 3002
      SUB_STORE_FRONTEND_HOST: 0.0.0.0
      PORT: 25501
      HOST: 0.0.0.0
    volumes:
      - ./sub-store-data:/opt/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3002/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
